<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Check-In</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap" style="text-align:center; padding-top: 60px; max-width: 420px;">
    <h1 id="title">Looking up ticket…</h1>
    <p id="detail" class="muted"></p>
    <button id="checkin-btn" class="hidden">Check In</button>
  </div>
  <script>
    const code = new URLSearchParams(location.search).get('code');
    const titleEl = document.getElementById('title');
    const detailEl = document.getElementById('detail');
    const btn = document.getElementById('checkin-btn');

    async function load() {
      if (!code) { titleEl.textContent = 'No ticket code provided.'; return; }
      const res = await fetch(`/api/admin/tickets/${code}`);
      if (!res.ok) { titleEl.textContent = '❌ Ticket not found'; return; }
      const b = await res.json();
      if (b.checked_in_at) {
        titleEl.textContent = '⚠️ Already checked in';
        detailEl.textContent = `${b.customer_email} — ${b.seat_labels.join(', ')} — at ${new Date(b.checked_in_at).toLocaleString()}`;
        return;
      }
      titleEl.textContent = '✅ Valid ticket';
      detailEl.textContent = `${b.show_name} — ${b.customer_email} — Seats: ${b.seat_labels.join(', ')}`;
      btn.classList.remove('hidden');
      btn.onclick = async () => {
        btn.disabled = true;
        const r = await fetch(`/api/admin/tickets/${code}/checkin`, { method: 'POST' });
        if (r.ok) {
          titleEl.textContent = '🎉 Checked in!';
          btn.classList.add('hidden');
        } else {
          btn.disabled = false;
          detailEl.textContent = 'Could not check in — it may have just been scanned by someone else.';
        }
      };
    }
    load();
  </script>
</body>
</html>
