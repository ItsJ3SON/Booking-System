<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Bookings</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 1200px; padding-bottom: 40px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; table-layout: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; min-width: 130px; }
  .actions button { margin: 0 !important; }
  th, td { text-align: left; padding: 8px 6px; vertical-align: top; word-break: break-word; border-bottom: 1px solid #2a2e38; }
  th { color: var(--muted); font-weight: 600; }
  .status { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
  .status.paid { background: var(--available); }
  .status.pending { background: var(--selected); color: #0f1115; }
  .status.failed { background: var(--booked); }
  .checked { color: var(--available); }
  .scopes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 18px 0 4px; }
  .scope { background: var(--panel); border: 2px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; text-align: left; color: var(--text); font-family: inherit; width: auto; }
  .scope.active { border-color: var(--accent); }
  .scope h3 { margin: 0 0 2px; font-size: 0.95rem; font-family: 'Fraunces', Georgia, serif; }
  .scope .when { color: var(--muted); font-size: 0.75rem; margin-bottom: 10px; }
  .scope .money { font-size: 1.6rem; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
  .scope .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: 0.7rem; color: var(--muted); }
  .scope .stats b { display: block; font-size: 1.1rem; color: var(--text); }
  .tickets-row td { background: var(--panel); padding: 16px; }
  .ticket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .ticket-card { background: #fbf6ee; color: #2b2320; border-radius: 8px; padding: 12px; text-align: center; font-size: 0.8rem; }
  .ticket-card img { width: 150px; height: 150px; display: block; margin: 8px auto; }
  .ticket-card .tname { font-size: 0.95rem; font-weight: 600; }
  .ticket-card a { color: #a8763e; }
  .ticket-card .in { color: #3f7a5c; font-weight: 600; }
  .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .topbar .links { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  /* Phones: each booking becomes its own card instead of a wide table row */
  @media (max-width: 760px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; padding: 6px 12px; }
    td { display: flex; justify-content: space-between; gap: 12px; text-align: right; border-bottom: 1px solid #2a2e38; padding: 8px 0; }
    td:last-child { border-bottom: none; }
    td::before { content: attr(data-label); color: var(--muted); font-weight: 600; text-align: left; flex-shrink: 0; }
    td .actions { justify-content: flex-end; min-width: 0; }
    tr.tickets-row { padding: 0; }
    tr.tickets-row td { display: block; text-align: center; padding: 12px; }
    tr.tickets-row td::before { content: none; }
    .scopes { grid-template-columns: 1fr; }
  }
  @media print { .no-print { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Bookings</h1>
      <div class="links">
        <a href="/admin/ticket.html" style="color:var(--muted); font-size:0.85rem;">Scan Tickets</a>
        <a href="/admin/cash.html" style="color:var(--muted); font-size:0.85rem;">Cash Booking</a>
        <a href="/admin/seats.html" style="color:var(--muted); font-size:0.85rem;">Manage Seats</a>
        <button id="logout-btn" style="width:auto; padding:8px 16px; font-size:0.85rem;">Log out</button>
      </div>
    </div>
    <div id="scopes" class="scopes"></div>
    <h2 id="list-title" style="font-size:1.1rem; margin:24px 0 8px;">Bookings</h2>
    <p class="muted" id="summary">Loading…</p>
    <div>
      <table>
        <thead>
          <tr><th>Show</th><th>Email</th><th>Tickets</th><th>Amount</th><th>Status</th><th>Checked in</th><th>When</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script>
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const openRows = new Set(); // booking ids whose tickets are expanded

    function ticketCards(b) {
      if (!b.tickets.length) return '<p class="muted">No tickets on this booking.</p>';
      return `<div class="ticket-grid">${b.tickets.map((t) => `
        <div class="ticket-card">
          <div class="tname">${esc(t.name || 'Guest')}</div>
          <div>Seat ${esc(t.label)}</div>
          <img src="/api/tickets/${esc(t.code)}/qr.png" alt="QR code">
          <div>${t.checked_in_at ? `<span class="in">✓ Checked in ${new Date(t.checked_in_at).toLocaleTimeString()}</span>` : 'Not checked in'}</div>
          <div><a href="/api/tickets/${esc(t.code)}/qr.png" download="ticket-${esc(t.label)}-${esc(t.code)}.png" class="no-print">Download QR</a></div>
          <div style="color:#867a6e;">${esc(t.code)}</div>
        </div>`).join('')}</div>
        <p class="no-print" style="margin:12px 0 0;"><button data-print="${b.id}" style="width:auto; padding:6px 14px; font-size:0.8rem;">Print these tickets</button></p>`;
    }

    let shows = [];
    let allBookings = [];
    let selected = 'all'; // 'all' or a show id

    function statsFor(list) {
      const paid = list.filter((b) => b.status === 'paid');
      const tickets = paid.reduce((n, b) => n + b.tickets.length, 0);
      // Cash seats have no QR code, so they can't be scanned — count scanning on online tickets only.
      const online = paid.filter((b) => b.payment_method !== 'cash');
      const cash = paid.filter((b) => b.payment_method === 'cash');
      const onlineTickets = online.reduce((n, b) => n + b.tickets.length, 0);
      const scanned = online.reduce((n, b) => n + b.tickets.filter((t) => t.checked_in_at).length, 0);
      const cents = paid.reduce((n, b) => n + b.amount_cents, 0);
      const cashSeats = cash.reduce((n, b) => n + b.tickets.length, 0);
      const cashCents = cash.reduce((n, b) => n + b.amount_cents, 0);
      return { bookings: paid.length, tickets, onlineTickets, scanned, cents, cashSeats, cashCents };
    }

    function scopeCard(key, title, when, list) {
      const st = statsFor(list);
      return `<button class="scope ${String(selected) === String(key) ? 'active' : ''}" data-scope="${key}">
        <h3>${esc(title)}</h3>
        <div class="when">${esc(when)}</div>
        <div class="money">€${(st.cents / 100).toFixed(2)}</div>
        <div class="stats">
          <div><b>${st.tickets}</b>people coming</div>
          <div><b>${st.scanned}</b>scanned in</div>
          <div><b>${st.onlineTickets - st.scanned}</b>not yet in</div>
        </div>
        <div class="when" style="margin:8px 0 0;">Incl. cash: ${st.cashSeats} seat${st.cashSeats === 1 ? '' : 's'} · €${(st.cashCents / 100).toFixed(2)} (not scanned)</div>
      </button>`;
    }

    function renderScopes() {
      const cards = [scopeCard('all', 'All shows', 'Everything combined', allBookings)];
      shows.forEach((s) => {
        const d = new Date(s.starts_at);
        const when = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Malta' });
        cards.push(scopeCard(s.id, s.name, when, allBookings.filter((b) => b.show_id === s.id)));
      });
      document.getElementById('scopes').innerHTML = cards.join('');
    }

    document.getElementById('scopes').addEventListener('click', (e) => {
      const card = e.target.closest('[data-scope]');
      if (!card) return;
      const v = card.getAttribute('data-scope');
      selected = v === 'all' ? 'all' : Number(v);
      render();
    });

    async function load() {
      const [res, showsRes] = await Promise.all([fetch('/api/admin/bookings'), fetch('/api/shows')]);
      if (res.status === 401) { window.location.href = '/admin/login.html'; return; }
      allBookings = await res.json();
      shows = showsRes.ok ? await showsRes.json() : [];
      render();
    }

    function render() {
      renderScopes();
      const bookings = selected === 'all' ? allBookings : allBookings.filter((b) => b.show_id === selected);
      const title = selected === 'all' ? 'All bookings' : 'Bookings — ' + ((shows.find((s) => s.id === selected) || {}).name || '');
      document.getElementById('list-title').textContent = title;
      document.getElementById('summary').textContent = `${bookings.length} booking${bookings.length === 1 ? '' : 's'}`;
      document.getElementById('rows').innerHTML = bookings.map(b => {
        const done = b.tickets.filter((t) => t.checked_in_at).length;
        const open = openRows.has(b.id);
        return `
        <tr>
          <td data-label="Show">${esc(b.show_name)}</td>
          <td data-label="Email">${b.payment_method === 'cash' ? '<em>Cash — paid at the door</em>' : esc(b.customer_email)}</td>
          <td data-label="Tickets">${b.tickets.map((t) => `${esc(t.name || 'Guest')} (${esc(t.label)})`).join('<br>') || '—'}</td>
          <td data-label="Amount">€${(b.amount_cents / 100).toFixed(2)}</td>
          <td data-label="Status"><span class="status ${esc(b.status)}">${esc(b.status)}</span></td>
          <td data-label="Checked in">${b.payment_method === 'cash' ? '—' : (b.tickets.length ? `<span class="${done === b.tickets.length ? 'checked' : ''}">${done}/${b.tickets.length}</span>` : '—')}</td>
          <td data-label="When">${new Date(b.created_at).toLocaleString()}</td>
          <td data-label="Actions"><div class="actions">
            ${b.status === 'paid' && b.payment_method !== 'cash' ? `<button data-tickets="${b.id}" style="width:auto; padding:4px 10px; font-size:0.75rem; margin-right:4px;">${open ? 'Hide' : 'View'} QR codes</button>` : ''}
            ${b.status === 'paid' && b.payment_method !== 'cash' ? `<button data-resend="${b.id}" style="width:auto; padding:4px 10px; font-size:0.75rem; margin-right:4px;">Resend email</button>` : ''}
            <button data-delete="${b.id}" style="width:auto; padding:4px 10px; font-size:0.75rem; background:var(--booked);">Delete</button>
          </div></td>
        </tr>
        ${open ? `<tr class="tickets-row"><td colspan="8">${ticketCards(b)}</td></tr>` : ''}`;
      }).join('');
    }

    document.getElementById('rows').addEventListener('click', async (e) => {
      const resendId = e.target.getAttribute('data-resend');
      const deleteId = e.target.getAttribute('data-delete');
      const ticketsId = e.target.getAttribute('data-tickets');
      const printId = e.target.getAttribute('data-print');

      if (printId) { window.print(); return; }

      if (ticketsId) {
        const id = Number(ticketsId);
        if (openRows.has(id)) openRows.delete(id); else openRows.add(id);
        load();
        return;
      }

      if (resendId) {
        e.target.disabled = true;
        e.target.textContent = 'Sending…';
        const res = await fetch(`/api/admin/bookings/${resendId}/resend-email`, { method: 'POST' });
        const data = await res.json();
        e.target.disabled = false;
        e.target.textContent = res.ok ? 'Sent ✓' : (data.error || 'Failed');
      }

      if (deleteId) {
        if (!confirm('Delete this booking? This releases the seats back to available and cannot be undone.')) return;
        const res = await fetch(`/api/admin/bookings/${deleteId}`, { method: 'DELETE' });
        if (res.ok) load();
        else alert('Could not delete booking.');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.href = '/admin/login.html';
    });

    load();
  </script>
</body>
</html>
