<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Manage Seats</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { max-width: 900px; padding-bottom: 60px; }
  #show-select { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-family: inherit; margin-bottom: 16px; }
  .nav-link { color: var(--muted); font-size: 0.85rem; }
  .seat.blockable:hover { outline: 2px solid var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>Manage Seats</h1>
      <a class="nav-link" href="/admin/index.html">← Bookings</a>
    </div>
    <p class="muted">Click an available (green) seat to block it — e.g. for a VIP hold. Click a blocked (purple) seat to release it back on sale. Held or booked seats can't be changed here.</p>

    <select id="show-select"></select>

    <div class="legend">
      <span><i class="dot available"></i> Available</span>
      <span><i class="dot held"></i> Held by a customer</span>
      <span><i class="dot booked"></i> Booked</span>
      <span><i class="dot blocked"></i> Blocked (VIP/other)</span>
    </div>

    <div id="screen">STAGE</div>
    <div id="seat-map"></div>
    <p id="error-msg" class="error"></p>
  </div>

  <script>
    let currentShowId = null;
    let seats = [];
    const seatMapEl = document.getElementById('seat-map');
    const errorEl = document.getElementById('error-msg');
    const showSelect = document.getElementById('show-select');

    async function loadShows() {
      const shows = await fetch('/api/shows').then(r => r.json());
      showSelect.innerHTML = shows.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      currentShowId = shows[0]?.id;
      if (currentShowId) loadSeats();
    }
    showSelect.addEventListener('change', () => {
      currentShowId = showSelect.value;
      loadSeats();
    });

    async function loadSeats() {
      seats = await fetch(`/api/shows/${currentShowId}/seats`).then(r => r.json());
      renderSeats();
    }

    function makeSeatButton(seat) {
      const btn = document.createElement('button');
      btn.className = 'seat';
      btn.textContent = seat.seat_number;
      btn.title = `${seat.label} — ${seat.status}`;
      if (seat.status !== 'available') btn.classList.add(seat.status);
      if (seat.status === 'available' || seat.status === 'blocked') {
        btn.classList.add('blockable');
        btn.addEventListener('click', () => toggleBlock(seat));
      } else {
        btn.disabled = true;
      }
      return btn;
    }

    function makeRowLabel(rowName) {
      const label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = rowName;
      return label;
    }

    function renderSeats() {
      const rows = {};
      seats.forEach(s => { (rows[s.row_name] ||= []).push(s); });
      seatMapEl.innerHTML = '';
      Object.keys(rows).sort().forEach(rowName => {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        const left = rows[rowName].filter(s => s.side === 'L').sort((a, b) => a.seat_number - b.seat_number);
        const right = rows[rowName].filter(s => s.side === 'R').sort((a, b) => a.seat_number - b.seat_number);
        rowEl.appendChild(makeRowLabel(rowName));
        [...left].reverse().forEach(seat => rowEl.appendChild(makeSeatButton(seat)));
        const gap = document.createElement('div');
        gap.className = 'aisle-gap';
        rowEl.appendChild(gap);
        right.forEach(seat => rowEl.appendChild(makeSeatButton(seat)));
        seatMapEl.appendChild(rowEl);
      });
    }

    async function toggleBlock(seat) {
      errorEl.textContent = '';
      const action = seat.status === 'available' ? 'block' : 'unblock';
      try {
        const res = await fetch(`/api/admin/seats/${seat.id}/${action}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not update seat');
        loadSeats();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    loadShows();
  </script>
</body>
</html>
