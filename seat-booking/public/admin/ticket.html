<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-In Scanner</title>
<link rel="stylesheet" href="../style.css">
<style>
  .scan-wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  .scan-wrap h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .top-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .top-row a { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }

  #camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin: 16px 0;
    border: 1px solid var(--border);
  }
  #camera-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #camera-box canvas { display: none; }
  .scan-frame {
    position: absolute; inset: 12%;
    border: 3px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.25);
    pointer-events: none;
  }
  #camera-msg {
    position: absolute; inset: 0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding: 20px; color: var(--muted); font-size: 0.9rem;
  }

  .manual-row { display:flex; gap:8px; margin-bottom: 20px; }
  .manual-row input { flex: 1; }
  .manual-row button { width: auto; padding: 10px 16px; }

  #result {
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    min-height: 68px;
  }
  #result.valid { border-color: var(--available); }
  #result.already { border-color: var(--selected); }
  #result.invalid { border-color: var(--booked); }
  #result .r-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
  #result .r-detail { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  #result button { margin-top: 12px; width: auto; padding: 8px 18px; }
  #result .placeholder { color: var(--muted); font-size: 0.9rem; }

  #log { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow-y: auto; }
  #log li {
    display:flex; justify-content:space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 0.82rem; color: var(--muted);
  }
  #log li .tag { font-weight: 600; }
  #log li .tag.valid { color: var(--available); }
  #log li .tag.already { color: var(--selected); }
  #log li .tag.invalid { color: var(--booked); }
  h2.log-title { font-size: 0.95rem; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
</style>
</head>
<body>
  <div class="scan-wrap">
    <div class="top-row">
      <h1>Check-In Scanner</h1>
      <a href="/admin/index.html">← Bookings</a>
    </div>
    <p class="muted" style="margin-top:0;">Point the camera at a ticket's QR code. Results appear below — stay on this page and keep scanning.</p>

    <div id="camera-box">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="canvas"></canvas>
      <div class="scan-frame" id="scan-frame" hidden></div>
      <div id="camera-msg">Starting camera…</div>
    </div>

    <div class="manual-row">
      <input id="manual-input" type="text" placeholder="Or type/paste a ticket code">
      <button id="manual-btn">Look up</button>
    </div>

    <div id="result">
      <p class="placeholder">Scan a ticket to see its status here.</p>
    </div>

    <h2 class="log-title">Recent scans</h2>
    <ul id="log"></ul>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const cameraMsg = document.getElementById('camera-msg');
    const scanFrame = document.getElementById('scan-frame');
    const resultEl = document.getElementById('result');
    const manualInput = document.getElementById('manual-input');
    const manualBtn = document.getElementById('manual-btn');
    const logEl = document.getElementById('log');

    let scanningPaused = false;
    let lastCode = null;
    let lastCodeAt = 0;
    const RESCAN_COOLDOWN_MS = 4000; // ignore the exact same code again within this window

    // The QR encodes a full URL like ".../admin/ticket.html?code=XXXX" (so a
    // plain phone camera still works as a fallback). Pull the code out of
    // that, or just use the raw text if it isn't a URL.
    function extractCode(raw) {
      try {
        const u = new URL(raw);
        const c = u.searchParams.get('code');
        if (c) return c;
      } catch (_) { /* not a URL — fall through */ }
      return raw.trim();
    }

    function addLogEntry(label, tag, detail) {
      const li = document.createElement('li');
      li.innerHTML = `<span><span class="tag ${tag}">${label}</span> ${detail || ''}</span><span>${new Date().toLocaleTimeString()}</span>`;
      logEl.prepend(li);
      while (logEl.children.length > 25) logEl.removeChild(logEl.lastChild);
    }

    function renderValid(b, code) {
      resultEl.className = 'valid';
      resultEl.innerHTML = `
        <div class="r-title">✅ Valid ticket</div>
        <div class="r-detail">${b.show_name}<br>${b.customer_email}<br>Seats: ${b.seat_labels.join(', ') || '—'}</div>
        <button id="checkin-btn">Check in</button>
      `;
      document.getElementById('checkin-btn').onclick = async (e) => {
        e.target.disabled = true;
        e.target.textContent = 'Checking in…';
        try {
          const r = await fetch(`/api/admin/tickets/${code}/checkin`, { method: 'POST' });
          if (r.ok) {
            resultEl.className = 'valid';
            resultEl.innerHTML = `<div class="r-title">🎉 Checked in</div><div class="r-detail">${b.show_name}<br>${b.customer_email}<br>Seats: ${b.seat_labels.join(', ') || '—'}</div>`;
            addLogEntry('Checked in', 'valid', b.customer_email);
          } else {
            const data = await r.json().catch(() => ({}));
            e.target.disabled = false;
            e.target.textContent = 'Check in';
            resultEl.querySelector('.r-detail').insertAdjacentHTML('beforeend', `<br><span style="color:var(--booked);">${data.error || 'Could not check in — it may have just been scanned by someone else.'}</span>`);
          }
        } catch (err) {
          e.target.disabled = false;
          e.target.textContent = 'Check in';
        }
      };
    }

    function renderAlready(b) {
      resultEl.className = 'already';
      resultEl.innerHTML = `
        <div class="r-title">⚠️ Already checked in</div>
        <div class="r-detail">${b.show_name}<br>${b.customer_email}<br>Seats: ${b.seat_labels.join(', ') || '—'}<br>at ${new Date(b.checked_in_at).toLocaleString()}</div>
      `;
      addLogEntry('Already in', 'already', b.customer_email);
    }

    function renderInvalid(message) {
      resultEl.className = 'invalid';
      resultEl.innerHTML = `<div class="r-title">❌ Not found</div><div class="r-detail">${message || 'This code does not match any ticket.'}</div>`;
      addLogEntry('Not found', 'invalid', message || '');
    }

    async function lookup(rawCode) {
      const code = extractCode(rawCode);
      if (!code) return;

      // Debounce: skip if this is the same code we just handled a moment ago,
      // so holding a QR in front of the camera doesn't spam repeat lookups —
      // but a different ticket is always picked up immediately.
      const now = Date.now();
      if (code === lastCode && now - lastCodeAt < RESCAN_COOLDOWN_MS) return;
      lastCode = code;
      lastCodeAt = now;

      try {
        const res = await fetch(`/api/admin/tickets/${encodeURIComponent(code)}`);
        if (!res.ok) { renderInvalid(); return; }
        const b = await res.json();
        if (b.checked_in_at) renderAlready(b);
        else renderValid(b, code);
      } catch (err) {
        renderInvalid('Lookup failed — check your connection and try again.');
      }
    }

    manualBtn.addEventListener('click', () => {
      if (manualInput.value.trim()) lookup(manualInput.value.trim());
      manualInput.value = '';
    });
    manualInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') manualBtn.click();
    });

    // ---- camera scanning loop ----
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
        });
        video.srcObject = stream;
        await video.play();
        cameraMsg.style.display = 'none';
        scanFrame.hidden = false;
        requestAnimationFrame(tick);
      } catch (err) {
        cameraMsg.textContent = 'Camera unavailable — use the text box above to look up codes instead.';
      }
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const qr = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height) : null;
        if (qr && qr.data && !scanningPaused) {
          lookup(qr.data);
        }
      }
      requestAnimationFrame(tick);
    }

    startCamera();
  </script>
</body>
</html>
