<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Your Seats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1 id="show-name">Loading show…</h1>
    <p id="show-meta" class="muted"></p>

    <div class="legend">
      <span><i class="dot available"></i> Available</span>
      <span><i class="dot selected"></i> Selected</span>
      <span><i class="dot held"></i> Held by someone</span>
      <span><i class="dot booked"></i> Booked</span>
    </div>

    <div id="screen">STAGE</div>
    <div id="seat-map"></div>

    <div class="panel">
      <div id="selection-summary">Select your seats above</div>
      <div id="timer" class="hidden"></div>
      <div id="checkout-form" class="hidden">
        <input id="email" type="email" placeholder="you@example.com" required>
        <button id="pay-btn">Pay & Confirm</button>
      </div>
      <button id="hold-btn" disabled>Reserve Selected Seats</button>
      <p id="error-msg" class="error"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
