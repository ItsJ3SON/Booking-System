<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a Show</title>
<link rel="stylesheet" href="style.css">
<style>
  .shows { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
  .show-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 18px; text-decoration: none; color: inherit; display: block;
  }
  .show-card h2 { font-family: 'Fraunces', Georgia, serif; font-size: 1.2rem; margin: 0 0 4px; }
  .show-card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Choose a show</h1>
    <p class="muted">Pick which night you're booking for.</p>
    <div class="shows" id="shows">Loading…</div>
  </div>
  <script>
    async function load() {
      const shows = await fetch('/api/shows').then(r => r.json());
      document.getElementById('shows').innerHTML = shows.map(s => {
        const date = new Date(s.starts_at);
        const dateStr = date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/Malta' });
        const whenStr = s.time_tbc ? `${dateStr} — Time TBC` : `${dateStr}, ${date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Europe/Malta' })}`;
        return `
          <a class="show-card" href="/index.html?show=${s.id}">
            <h2>${s.name}</h2>
            <p>${s.venue}</p>
            <p>${whenStr}</p>
          </a>
        `;
      }).join('');
    }
    load();
  </script>
</body>
</html>
