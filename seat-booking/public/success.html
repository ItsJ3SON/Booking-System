<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Confirmed</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap" style="text-align:center; padding-top: 60px;">
    <h1 id="status">Checking your payment…</h1>
    <p id="detail" class="muted"></p>
    <button onclick="location.href='/index.html'">Back to seat map</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('session_id');
    async function check() {
      if (!sessionId) { document.getElementById('status').textContent = 'No session found.'; return; }
      const res = await fetch(`/api/bookings/by-session/${sessionId}`);
      const data = await res.json();
      if (data.status === 'paid') {
        document.getElementById('status').textContent = '🎉 Booking confirmed!';
        document.getElementById('detail').textContent = `A confirmation was sent to ${data.customer_email}.`;
      } else {
        document.getElementById('status').textContent = 'Payment still processing…';
        document.getElementById('detail').textContent = 'This page will refresh automatically.';
        setTimeout(check, 2000);
      }
    }
    check();
  </script>
</body>
</html>
