services:
  - type: web
    name: seat-booking-system
    runtime: node
    plan: free
    rootDir: seat-booking
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: HOLD_MINUTES
        value: "10"
      - key: BASE_URL
        sync: false
      - key: PORT
        value: "10000"
