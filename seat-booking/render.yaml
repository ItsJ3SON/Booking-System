services:
  - type: web
    name: seat-booking-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false        # paste your Neon/Supabase connection string in the Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: HOLD_MINUTES
        value: "10"
      - key: BASE_URL
        sync: false        # set this to your Render URL once it's assigned, e.g. https://seat-booking-system.onrender.com
      - key: PORT
        value: "10000"
